<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장별 자금현황</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F2;--card:#FFFFFF;--surface2:#F6F8F5;--line:#D9DFD6;--line2:#E6EBE3;--ink:#172019;--sub:#566057;--sub2:#4A544B;--nav:#2F7A2C;--navh:#276724;--teal:#2F7A2C;--green-weak:#EBF5E4;--blue:#1A6FB5;--red:#D92D20;--amber:#C76A00;--radius:12px;--shadow:0 1px 2px rgba(23,32,25,.04),0 4px 14px rgba(23,32,25,.04)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
a{color:var(--teal)}
.num{font-family:'Pretendard Variable',Pretendard,Inter,sans-serif;font-variant-numeric:tabular-nums}
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch}
aside{flex:1 1 236px;max-width:100%;background:var(--nav);color:#E6ECF4;padding:24px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:10px;background:#12A3A8;display:flex;align-items:center;justify-content:center}
.navlbl{font-size:11px;font-weight:600;color:#8D9BB0;letter-spacing:.08em;padding:0 14px 6px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;background:transparent;color:#C9D3E0;text-decoration:none}
.navbtn.on{background:#1E3150;color:#FFF}
.navbtn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:2px solid #12A3A8;outline-offset:2px}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tab{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #C9D2DE;background:#FFF;color:#2A3648}
.tab.on{border-color:var(--nav);background:var(--nav);color:#FFF}
.th{font-size:12px;font-weight:600;color:var(--sub2);letter-spacing:.02em}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.c-done{background:#DDF3F4;color:#084F57}.c-plan{background:#FEF3C7;color:#92400E}.c-none{background:#EEF2F6;color:var(--sub2)}.c-merge{background:#EDE9FE;color:#5B21B6}
.c-fsg{background:#E0F2FE;color:#075985}
.fs-sub{display:block;font-size:11px;color:var(--sub2);line-height:1.3;white-space:normal;word-break:keep-all}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field>label{font-size:12px;font-weight:600;color:var(--sub2)}
.box{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF}
.box input{border:0;outline:none;font-size:15px;flex:1;min-width:0;color:var(--ink);background:transparent}
.dseg{display:flex;align-items:center;gap:1px;flex:1;min-width:0}
.dseg input{flex:0 0 auto;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.dseg input[data-dp="y"]{width:3.1em}.dseg input[data-dp="m"],.dseg input[data-dp="d"]{width:1.9em}
.dseg input::placeholder{color:#AEB7C4}
.dseg i{font-style:normal;color:var(--sub2)}
.dseg.bad{outline:0}.box:has(.dseg.bad){border-color:#DC2626}
select.sel{min-height:44px;padding:0 10px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF;font-size:14px;color:var(--ink)}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.dd{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:20;max-height:380px;overflow-y:auto;background:#FFF;border:1px solid #C9D2DE;border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.16);padding:6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:48px;padding:8px 10px;border:0;border-radius:8px;text-align:left;cursor:pointer;background:transparent}
.opt.sel,.opt:hover{background:#F2FAFA}.opt.act{background:#E6F5F6}
.opt b{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.opt small{font-size:12px;color:var(--sub)}
.grid-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.grid-sum>div{padding:18px 22px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.grid-sum>div:last-child{border-right:0}
.lbl{font-size:13px;font-weight:600;color:var(--sub2)}
.big{font-size:24px;font-weight:700}
.erp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.erp>div{padding:14px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line2)}
.erp>div:last-child{border-right:0}
.sec{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.scroll{overflow-x:auto}
.row{display:grid;gap:10px;align-items:center;min-height:42px;padding:0 8px;border-bottom:1px solid var(--line2);font-size:13px}
.head{display:grid;gap:10px;padding:10px 8px;background:#EEF2F6;border-radius:8px}
.r{text-align:right}
.muted{color:var(--sub);font-size:13px}
.err{padding:12px 14px;border-radius:10px;background:#FFF1F2;color:var(--red);font-size:13px}
.warn{padding:12px 14px;border-radius:10px;background:#FEF3C7;color:#78350F;font-size:13px}
.cal{min-width:560px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:92px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#FFF;border:1px solid var(--line)}
.cell.has{background:#F2FAFA;border-color:#B9E3E5}.cell.out{background:transparent;border-color:transparent}
.ev{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;background:#F3F5F8;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ERP 안에 끼워 볼 때(보기 전용): 왼쪽 메뉴 숨김 */
.mchip{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip:hover{filter:brightness(.96)}.mchip:focus-visible{outline:2px solid #12A3A8;outline-offset:2px}
.mm-bg{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.mm{width:min(560px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 48px rgba(15,27,45,.25)}
.mm-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.mx{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.tab:disabled{opacity:.5;cursor:default}
.le-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8D9BB0}
.le-btn:hover{background:#EEF2F6;color:var(--ink)}.le-btn:focus-visible{outline:2px solid #12A3A8;outline-offset:1px}
.le-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.le-grid .box{padding-right:12px}.le-grid input{font-size:15px}
@media (max-width:520px){.le-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100% - 32px));background:#0F1B2D;color:#FFF;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(15,27,45,.3)}
.mtoggle{display:flex;flex-wrap:wrap;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:4px 0;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.mtoggle:focus-visible{outline:2px solid #12A3A8;outline-offset:4px;border-radius:6px}

/* ===== 회사 ERP(hseferp) 디자인 맞춤 ===== */
aside{flex:0 0 236px;background:#FFF;color:var(--ink);border-right:1px solid var(--line2);padding:18px 12px;gap:20px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.brand{padding:2px 6px 14px;border-bottom:1px solid var(--line2)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--green-weak)}
.navlbl{font-size:11.5px;font-weight:600;color:#879086;letter-spacing:.02em;padding:0 10px 4px}
.navbtn{min-height:34px;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:#36403A;gap:10px}
.navbtn:hover{background:#F2F5F0;color:#172019}
.navbtn.on{background:var(--green-weak);color:var(--nav);font-weight:600}
.navbtn:focus-visible,.tab:focus-visible,.opt:focus-visible,.mchip:focus-visible,.mtoggle:focus-visible,.le-btn:focus-visible{outline:2px solid #8CC63F}
main{padding:22px 28px 48px;gap:16px}
.card{border:1px solid #D3DBD0;border-radius:var(--radius);box-shadow:var(--shadow)}
.tab{min-height:34px;padding:0 13px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#FFF;color:#36403A}
.tab:hover:not(:disabled){background:#F2F5F0}
.tab.on{border-color:var(--nav);background:var(--nav);color:#FFF}
.tab.on:hover:not(:disabled){background:var(--navh)}
.th{color:#6F796F}
.chip{border-radius:6px;padding:2px 8px}
.c-done{background:#E8F4DF;color:#1F5E1D}.c-plan{background:#FFF1DE;color:#8A4B00}.c-none{background:#EFF2ED;color:var(--sub)}.c-merge{background:#EDE9FE;color:#5B21B6}
.field>span,.field>label{color:#6F796F}
.box{min-height:36px;border:1px solid var(--line);border-radius:8px}
.box:focus-within{border-color:var(--nav);box-shadow:0 0 0 3px rgba(47,122,44,.12)}
.box input{font-size:14px}
select.sel{min-height:36px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
select.sel:focus{outline:none;border-color:var(--nav);box-shadow:0 0 0 3px rgba(47,122,44,.12)}
.dd{border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(23,32,25,.14)}
.opt.sel,.opt:hover{background:#F2F5F0}.opt.act{background:var(--green-weak)}
.grid-sum>div{padding:16px 18px;border-right:1px solid var(--line2)}
.lbl{font-size:12.5px;color:#6F796F}
.big{font-size:26px;font-weight:700;letter-spacing:-.01em}
.erp>div{padding:14px 18px}
.sec{padding:18px 20px}
.sec h2{font-size:16px;letter-spacing:-.01em}
.row{border-bottom:1px solid var(--line2)}
.row:hover{background:#FAFBF9}
.head{background:var(--surface2);border-radius:8px;border:1px solid var(--line2);color:#6F796F}
.err{background:#FDECEB;color:#B42318}
.warn{background:#FFF1DE;color:#7A4100}
.cell{border:1px solid var(--line2)}
.cell.has{background:#F4FAEF;border-color:#CFE5BF}
.pill{background:var(--surface2);border:1px solid var(--line)}
.le-btn{color:#879086}.le-btn:hover{background:#F2F5F0}
.mm-bg{background:rgba(23,32,25,.4)}
.mm{box-shadow:0 20px 48px rgba(23,32,25,.22)}
.toast{background:#172019;box-shadow:0 10px 30px rgba(23,32,25,.25)}
input[type=checkbox]{accent-color:var(--nav)}
::selection{background:#D6ECC6}
@media (max-width:900px){aside{flex:1 1 100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line2)}}
body.embed aside{display:none}
body.embed main{padding:20px 24px 32px}
@media (max-width:720px){main{padding:20px 16px 40px}.grid-sum{grid-template-columns:1fr}.grid-sum>div{border-right:0;border-bottom:1px solid var(--line)}.erp{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F7A2C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700;color:#172019">효성에너지팜</span><span style="font-size:12px;color:#566057">현장별 자금현황</span></div>
    </div>
    <nav aria-label="메뉴" style="display:flex;flex-direction:column;gap:4px">
      <span class="navlbl">메인</span>
      <button class="navbtn" data-page="site">현장별 자금현황</button>
      <span class="navlbl" style="padding-top:18px">관리 시트</span>
      <button class="navbtn" data-page="calendar">채권관리 달력</button>
      <button class="navbtn" data-page="notice">미납공문 처리로그</button>
      <button class="navbtn" data-page="ledger">일자별 기록</button>
      <button class="navbtn" data-page="commission">영업수당관리</button>
      <button class="navbtn" data-page="daily">일일자금일보</button>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <button class="navbtn" id="reloadBtn" style="border:1px solid #D9DFD6">↻ 최신 내용 다시 불러오기</button>
      <a class="navbtn" href="https://hseferp.vercel.app/erp/app.html#bonds" target="_top" style="border:1px solid #D9DFD6;color:#36403A">← 회사 ERP</a>
      <a class="navbtn" href="https://docs.google.com/spreadsheets/d/1ERb-Mc878u3fY8Vv4ZvSSibzlMI7DpJG4nnv_qvvoiE/edit" target="_blank" rel="noopener" style="font-size:13px;color:#566057">원본 스프레드시트 ↗</a>
      <span class="num" id="syncInfo" style="font-size:11px;color:#879086;padding:0 14px;line-height:1.6"></span>
    </div>
  </aside>
  <main id="main"><div class="card sec muted">불러오는 중입니다…</div></main>
  <section id="dailyWrap" style="display:none;flex:999 1 560px;min-width:0;flex-direction:column;height:100vh">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #D9DFD6;background:#fff;font-size:13px"><b>일일자금일보</b><a href="https://script.google.com/macros/s/AKfycbwKjdFgBMnxzSd5j4gLr9OjEcoEJkIw2SjvL5Is7wqQFVlj8uGrfOhA6LlGgrrRy5qttQ/exec" target="_blank" rel="noopener" style="color:#2F7A2C">새 창으로 열기 ↗</a></div>
    <iframe id="dailyFrame" title="일일자금일보" style="flex:1;width:100%;border:0;min-height:0" allow="clipboard-read; clipboard-write"></iframe>
  </section>
</div>

<script>
(function () {
  var S = { page: 'site', tab: '전체', month: '', selId: '', typed: '', dd: false, act: 0,
            bonds: null, fund: null, sheets: null, err: {}, kind: '전체', query: '', calYM: '' };
  var TABS = ['전체', '회수 중', '회수 확인 대기', '완료현장', 'ERP 미등록'];
  var $ = function (id) { return document.getElementById(id); };
  var h = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return (n === null || n === undefined || n === '') ? '—' : (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); };
  var dot = function (iso) { return iso ? iso.replace(/-/g, '.') : ''; };
  var norm = function (v) { return String(v || '').normalize('NFKC').replace(/\s/g, '').replace(/[-~,]/g, '').toLowerCase(); };
  var key = function (v) {
    var s = String(v || '').split('\n')[0].normalize('NFKC').replace(/태양광발전소|발전소/g, '').replace(/\(주\)|주식회사|\(유\)/g, '');
    s = s.replace(/(\d)\s*[-,]\s*(\d)/g, '$1~$2').replace(/\s/g, '').toLowerCase();
    return s;
  };
  try { var saved = JSON.parse(localStorage.getItem('fs-view') || '{}'); if (saved.tab) S.tab = saved.tab; if (saved.selId) S.selId = saved.selId; } catch (e) {}
  try { S.expView = localStorage.getItem('fs-expview') || 'cat'; } catch (e) { S.expView = 'cat'; }
  function save() { try { localStorage.setItem('fs-view', JSON.stringify({ tab: S.tab, selId: S.selId })); } catch (e) {} }

  /* ---------- 데이터 ---------- */
  // 데이터 통로 (Apps Script '현장별 자금현황 웹앱' 배포 주소)
  var API = 'https://script.google.com/macros/s/AKfycbzuNUa1MUpLHfupz4Z6kIGnPP2JDKTf-1mOFMYKaf_xfZoWco_PuF9jhy_XGuRsBilDhg/exec';
  // ?embed=1 → 회사 ERP 안에서 '현장별 자금현황' 화면만 보기 전용으로 표시
  var EMBED = /[?&]embed=1\b/.test(location.search) && window.parent !== window;
  var ERP_ORIGIN = 'https://hseferp.vercel.app';
  var memKey = '';   // ERP가 넘겨준 키 (보기 모드에서는 저장하지 않고 메모리에만 둠)
  if (EMBED) { document.body.classList.add('embed'); S.page = 'site'; }
  function getKey() { if (EMBED) return memKey; try { return localStorage.getItem('fs-key') || ''; } catch (e) { return ''; } }
  function setKey(k) { if (EMBED) { memKey = k || ''; return; } try { if (k) localStorage.setItem('fs-key', k); else localStorage.removeItem('fs-key'); } catch (e) {} }
  var keyWait = null;
  function askErpKey() {
    try { window.parent.postMessage({ type: 'fs-need-key' }, ERP_ORIGIN); } catch (e) {}
    clearTimeout(keyWait);
    keyWait = setTimeout(function () { if (!memKey) showGate('ERP에서 접속 키를 받지 못했습니다. 직접 입력해 주세요.'); }, 5000);
  }
  window.addEventListener('message', function (e) {
    if (!EMBED || e.origin !== ERP_ORIGIN || e.source !== window.parent) return;
    var d = e.data || {};
    if (d.type === 'fs-key' && typeof d.key === 'string' && d.key) { clearTimeout(keyWait); var first = !memKey; memKey = d.key; S.err = {}; if (first) { render(); load(); } }
  });
  var PART = { getBonds: 'bonds', getFund: 'fund', getSheets: 'sheets', getSites: 'sites', getMatches: 'matches', getCommission: 'commission' };
  function call(fn, cb) {
    var part = PART[fn];
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: getKey(), parts: [part] }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) { if (r.code === 'key') { setKey(''); showGate(EMBED ? 'ERP에 등록된 접속 키가 맞지 않습니다. 직접 입력하거나 관리자에게 알려 주세요.' : '접속 키가 맞지 않습니다. 다시 입력해 주세요.'); return; } throw new Error(r.error || '알 수 없는 오류'); }
        if (r[part + 'Error']) throw new Error(r[part + 'Error']);
        if (r[part] === undefined) throw new Error('Apps Script를 새 버전으로 배포해야 합니다.');
        S.err[fn] = ''; cb(r[part]); render();
      })
      .catch(function (e) { S.err[fn] = (e && e.message) || String(e); render(); });
  }
  function load() {

    return out + '<section class="card sec"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><h2>미납 공문 발송 대상</h2><span class="num" style="font-size:14px;color:var(--sub2)">합계 <strong style="color:var(--ink)">' + fmt(total) + '</strong> 원</span></div><div class="scroll"><div style="min-width:830px">' +
      '<div class="head" style="' + g + '"><span class="th">현장</span><span class="th">사업주</span><span class="th">사용전검사</span><span class="th">기한일</span><span class="th r">미납 금액</span><span class="th r">공문 작성일</span><span class="th"></span></div>' +
      N.map(function (n) { return '<div class="row" style="' + g + ';font-size:14px;min-height:50px"><span style="font-weight:600">' + h(n.site) + '</span><span style="color:var(--sub2)">' + h(n.owner || '—') + '</span><span class="num">' + dot(n.insp) + '</span><span class="num">' + dot(n.due) + '</span><span class="num r" style="font-weight:600;color:var(--red)">' + fmt(n.amt) + '</span><span class="num r" style="color:var(--sub2)">' + dot(n.date) + '</span><span><button class="tab" data-nfpick="' + h(n.site) + '" style="min-height:34px;padding:0 10px">작성</button></span></div>'; }).join('') + '</div></div></section>';
  }
  function docVals(f, kind) {
    var due = numOf(f.due);
    if (kind === '미납공문') return { 문서번호: f.docNo || '', 시행일자: kDate(f.date), 수신: (f.owner || '') + ' (' + (f.site || '') + ' 태양광발전소)', 발전소: f.site || '', 사업주: f.owner || '', 사용전검사일: kDate(f.idate), 지급조건: f.cond || '', 잔금지급기한: kDate(f.ddate), 미납금액: '금 ' + won(due) + '원 (금 ' + hangul(due) + '원정)' };
    var tot = numOf(f.total), paid = numOf(f.paid);
    return { 시행일자: kDate(f.date), 사업주: f.owner || '', 주소: f.addr || '', 발전소: f.site || '', 계약일: kDate(f.cdate), 준공일: kDate(f.idate), 총공사대금: won(tot), 총공사대금_한글: hangul(tot), 기수령액: won(paid) || '0', 미수금: won(due), 미수금_한글: hangul(due) };
  }
  var CRC_T = null;
  function zipStore(files) {
    if (!CRC_T) { CRC_T = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC_T[n] = c >>> 0; } }
    var crc32 = function (a) { var c = 0xFFFFFFFF; for (var i = 0; i < a.length; i++) c = CRC_T[(c ^ a[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    var enc = new TextEncoder(), parts = [], central = [], off = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = f.data, crc = crc32(data), hd = new DataView(new ArrayBuffer(30));
      hd.setUint32(0, 0x04034b50, true); hd.setUint16(4, 20, true); hd.setUint16(6, 0x0800, true); hd.setUint16(12, 0x21, true); hd.setUint32(14, crc, true); hd.setUint32(18, data.length, true); hd.setUint32(22, data.length, true); hd.setUint16(26, name.length, true);
      parts.push(new Uint8Array(hd.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name); off += 30 + name.length + data.length;
    });
    var cs = 0; central.forEach(function (x) { cs += x.length; });
    var e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
    var all = parts.concat(central, [new Uint8Array(e.buffer)]), len = 0; all.forEach(function (x) { len += x.length; });
    var out = new Uint8Array(len), p = 0; all.forEach(function (x) { out.set(x, p); p += x.length; }); return out;
  }
  function makeDocx(f, kind) {
    var get = TPLS[kind] ? Promise.resolve(TPLS[kind]) : fetch(TPL_SRC[kind] + '?v=3').then(function (r) { if (!r.ok) throw new Error('양식 파일 없음'); return r.json(); }).then(function (t) { TPLS[kind] = t; return t; });
    return get.then(function (tpl) {
      var vals = docVals(f, kind), esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
      var doc = tpl.doc.replace(/\{\{([^}]+)\}\}/g, function (m, k) { return esc(vals[k]); }).replace(/<w:highlight w:val="yellow"\/>/g, '');
      var enc = new TextEncoder(), b64 = function (b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
      return zipStore(tpl.order.map(function (name) { return { name: name, data: name === 'word/document.xml' ? enc.encode(doc) : b64(tpl.parts[name]) }; }));
    });
  }
  function fileName(f, kind) { return (kind === '미납공문' ? '잔금미납안내공문_' : '내용증명_') + String(f.site || '발전소').replace(/[\\\/:*?"<>|]/g, '_') + '_' + String(f.date || '').replace(/-/g, '') + '.docx'; }
  function saveBlob(name, blob) { var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 8000); }
  var DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  function nfPick(name) {
    var o = nfSources().filter(function (x) { return x.name === name; })[0];
    S.nf = Object.assign(emptyForm(), o ? o.fill : { site: name });
    S.nfQ = ''; S.nfOpen = false; S.nfMsg = o ? '' : name + ' — 불러온 정보가 없어 직접 입력해 주세요';
    if (S.page !== 'notice') S.page = 'notice';
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function nfMake() {
    var kind = S.nfKind, f = Object.assign({}, S.nf);
    if (!f.site || !numOf(f.due)) { S.nfMsg = '발전소와 금액을 입력해 주세요'; render(); return; }
    if (kind === '미납공문' && !f.docNo) f.docNo = nextDocNo(f.date);
    S.nfMsg = '파일 만드는 중…'; render();
    makeDocx(f, kind).then(function (bytes) {
      var fn = fileName(f, kind);
      saveBlob(fn, new Blob([bytes], { type: DOCX_MIME }));
      var L = lgGet(); L.unshift({ id: 'n' + Date.now().toString(36), kind: kind, docNo: kind === '미납공문' ? f.docNo : '', site: f.site, owner: f.owner || '', amount: numOf(f.due), date: f.date, status: '작성', reg: '', form: f, createdAt: new Date().toISOString() }); lgSet(L);
      S.nfMsg = fn + ' 저장 · 발송대장에 기록했습니다'; render();
    }).catch(function (e) { S.nfMsg = '파일을 만들지 못했습니다: ' + ((e && e.message) || e); render(); });
  }
  function lgUpdate(id, patch) { var L = lgGet(); L.forEach(function (r) { if (r.id === id) Object.assign(r, patch); }); lgSet(L); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-nfkind],[data-nfpick],#nfMake,#nfReset,#lgCsv,[data-lgagain],[data-lgdel]');
    if (!t) return;
    if (t.dataset.nfkind) { S.nfKind = t.dataset.nfkind; S.nfMsg = ''; render(); }
    else if (t.dataset.nfpick) nfPick(t.dataset.nfpick);
    else if (t.id === 'nfMake') nfMake();
    else if (t.id === 'nfReset') { S.nf = emptyForm(); S.nfQ = ''; S.nfMsg = ''; render(); }
    else if (t.id === 'lgCsv') {
      var rows = [['시행일자', '종류', '문서번호', '발전소', '사업주', '금액', '상태', '등기번호']].concat(lgGet().map(function (r) { return [r.date, r.kind, r.docNo || '', r.site, r.owner || '', r.amount, r.status, r.reg || '']; }));
      var csv = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
      saveBlob('공문발송대장_' + isoToday().replace(/-/g, '') + '.csv', new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    }
    else if (t.dataset.lgagain) { var r = lgGet().filter(function (x) { return x.id === t.dataset.lgagain; })[0]; if (r && r.form) makeDocx(r.form, r.kind).then(function (b) { saveBlob(fileName(r.form, r.kind), new Blob([b], { type: DOCX_MIME })); }); }
    else if (t.dataset.lgdel) { if (S.nfDel === t.dataset.lgdel) { lgSet(lgGet().filter(function (x) { return x.id !== t.dataset.lgdel; })); S.nfDel = ''; } else S.nfDel = t.dataset.lgdel; render(); }
  });
  document.addEventListener('mousedown', function (e) { if (e.target.closest('[data-nfpick]') && e.target.closest('#nfList')) e.preventDefault(); });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'nfSite') { S.nfQ = t.value; S.nfOpen = true; var l = $('nfList'); if (l) { l.style.display = 'block'; l.innerHTML = nfList(); } }
    else if (t.classList && t.classList.contains('nf-in')) {
      var k = t.dataset.f; S.nf[k] = t.value;
      if (k === 'idate') { S.nf.ddate = monthEnd(t.value); var dd = document.querySelector('.nf-in[data-f="ddate"]'); if (dd) dd.value = S.nf.ddate; }
      if ((k === 'total' || k === 'paid') && S.nfKind === '내용증명') { var d = numOf(S.nf.total) - numOf(S.nf.paid); S.nf.due = d > 0 ? won(d) : ''; var di = document.querySelector('.nf-in[data-f="due"]'); if (di) di.value = S.nf.due; var dh = $('nfh-due'); if (dh) dh.textContent = nfHint('due'); }
      var hEl = $('nfh-' + k); if (hEl) hEl.textContent = nfHint(k);
      nfRefresh();
    }
    else if (t.dataset && t.dataset.lgreg) lgUpdate(t.dataset.lgreg, { reg: t.value });
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('nf-in') && /^(total|paid|due)$/.test(t.dataset.f)) { var v = numOf(t.value); t.value = S.nf[t.dataset.f] = v ? won(v) : ''; }
    else if (t.dataset && t.dataset.lgst) lgUpdate(t.dataset.lgst, { status: t.value });
  });
  document.addEventListener('focusin', function (e) { if (e.target.id === 'nfSite') { try { e.target.select(); } catch (x) {} S.nfOpen = true; S.nfQ = ''; var l = $('nfList'); if (l) { l.style.display = 'block'; l.innerHTML = nfList(); } } });
  document.addEventListener('focusout', function (e) { if (e.target.id === 'nfSite') setTimeout(function () { S.nfOpen = false; S.nfQ = ''; var l = $('nfList'); if (l) l.style.display = 'none'; var i = $('nfSite'); if (i && document.activeElement !== i) i.value = S.nf.site || ''; }, 150); });

  render();
  load();
  setInterval(function () { if (!document.hidden && !S.dd) load(); }, 5 * 60 * 1000);
  // 다른 탭(일자별 기록 보관 등)에서 저장하고 돌아오면 자동으로 다시 불러오기
  var lastLoad = Date.now();
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !S.dd && Date.now() - lastLoad > 15000) { lastLoad = Date.now(); load(); } });
})();
</script>
