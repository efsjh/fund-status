<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장별 자금현황</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--line:#E3E8EF;--line2:#EEF2F6;--ink:#142033;--sub:#4A5668;--sub2:#3B4759;--nav:#0F1B2D;--teal:#0B6E78;--blue:#1D4ED8;--red:#9F1239;--amber:#B45309;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',Inter,sans-serif}
button,input,select{font-family:inherit}
a{color:var(--teal)}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch}
aside{flex:1 1 236px;max-width:100%;background:var(--nav);color:#E6ECF4;padding:24px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:10px;background:#12A3A8;display:flex;align-items:center;justify-content:center}
.navlbl{font-size:11px;font-weight:600;color:#8D9BB0;letter-spacing:.08em;padding:0 14px 6px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;background:transparent;color:#C9D3E0;text-decoration:none}
.navbtn.on{background:#1E3150;color:#FFF}
.navbtn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:2px solid #12A3A8;outline-offset:2px}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tab{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #C9D2DE;background:#FFF;color:#2A3648}
.tab.on{border-color:var(--nav);background:var(--nav);color:#FFF}
.th{font-size:12px;font-weight:600;color:var(--sub2);letter-spacing:.02em}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.c-done{background:#DDF3F4;color:#084F57}.c-plan{background:#FEF3C7;color:#92400E}.c-none{background:#EEF2F6;color:var(--sub2)}.c-merge{background:#EDE9FE;color:#5B21B6}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field>label{font-size:12px;font-weight:600;color:var(--sub2)}
.box{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF}
.box input{border:0;outline:none;font-size:15px;flex:1;min-width:0;color:var(--ink);background:transparent}
select.sel{min-height:44px;padding:0 10px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF;font-size:14px;color:var(--ink)}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.dd{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:20;max-height:380px;overflow-y:auto;background:#FFF;border:1px solid #C9D2DE;border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.16);padding:6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:48px;padding:8px 10px;border:0;border-radius:8px;text-align:left;cursor:pointer;background:transparent}
.opt.sel,.opt:hover{background:#F2FAFA}.opt.act{background:#E6F5F6}
.opt b{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.opt small{font-size:12px;color:var(--sub)}
.grid-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.grid-sum>div{padding:18px 22px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.grid-sum>div:last-child{border-right:0}
.lbl{font-size:13px;font-weight:600;color:var(--sub2)}
.big{font-size:24px;font-weight:700}
.erp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.erp>div{padding:14px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line2)}
.erp>div:last-child{border-right:0}
.sec{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.scroll{overflow-x:auto}
.row{display:grid;gap:10px;align-items:center;min-height:42px;padding:0 8px;border-bottom:1px solid var(--line2);font-size:13px}
.head{display:grid;gap:10px;padding:10px 8px;background:#EEF2F6;border-radius:8px}
.r{text-align:right}
.muted{color:var(--sub);font-size:13px}
.err{padding:12px 14px;border-radius:10px;background:#FFF1F2;color:var(--red);font-size:13px}
.warn{padding:12px 14px;border-radius:10px;background:#FEF3C7;color:#78350F;font-size:13px}
.cal{min-width:560px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:92px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#FFF;border:1px solid var(--line)}
.cell.has{background:#F2FAFA;border-color:#B9E3E5}.cell.out{background:transparent;border-color:transparent}
.ev{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;background:#F3F5F8;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ERP 안에 끼워 볼 때(보기 전용): 왼쪽 메뉴 숨김 */
.mchip{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip:hover{filter:brightness(.96)}.mchip:focus-visible{outline:2px solid #12A3A8;outline-offset:2px}
.mm-bg{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.mm{width:min(560px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 48px rgba(15,27,45,.25)}
.mm-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.mx{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.tab:disabled{opacity:.5;cursor:default}
.le-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8D9BB0}
.le-btn:hover{background:#EEF2F6;color:var(--ink)}.le-btn:focus-visible{outline:2px solid #12A3A8;outline-offset:1px}
.le-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.le-grid .box{padding-right:12px}.le-grid input{font-size:15px}
@media (max-width:520px){.le-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100% - 32px));background:#0F1B2D;color:#FFF;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(15,27,45,.3)}
.mtoggle{display:flex;flex-wrap:wrap;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:4px 0;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.mtoggle:focus-visible{outline:2px solid #12A3A8;outline-offset:4px;border-radius:6px}
body.embed aside{display:none}
body.embed main{padding:20px 24px 32px}
@media (max-width:720px){main{padding:20px 16px 40px}.grid-sum{grid-template-columns:1fr}.grid-sum>div{border-right:0;border-bottom:1px solid var(--line)}.erp{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700;color:#FFF">효성에너지팜</span><span style="font-size:12px;color:#A9B6C8">현장별 자금현황</span></div>
    </div>
    <nav aria-label="메뉴" style="display:flex;flex-direction:column;gap:4px">
      <span class="navlbl">메인</span>
      <button class="navbtn" data-page="site">현장별 자금현황</button>
      <span class="navlbl" style="padding-top:18px">관리 시트</span>
      <button class="navbtn" data-page="calendar">채권관리 달력</button>
      <button class="navbtn" data-page="notice">미납공문 처리로그</button>
      <button class="navbtn" data-page="ledger">일자별 기록</button>
      <a class="navbtn" href="https://script.google.com/macros/s/AKfycbymTGjB-yBTcXqcMi09SRXBZ-WgRoJD1eq-wKOtNuB5Zyr7DAlEjRr7Clv4n5oeJubI/exec" target="_blank" rel="noopener">일자별 기록 보관 ↗</a>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <button class="navbtn" id="reloadBtn" style="border:1px solid #2B3A52">↻ 최신 내용 다시 불러오기</button>
      <a class="navbtn" href="https://hseferp.vercel.app/erp/app.html#bonds" target="_top" style="border:1px solid #2B3A52;color:#E6ECF4">← 회사 ERP</a>
      <a class="navbtn" href="https://docs.google.com/spreadsheets/d/1ERb-Mc878u3fY8Vv4ZvSSibzlMI7DpJG4nnv_qvvoiE/edit" target="_blank" rel="noopener" style="font-size:13px;color:#A9B6C8">원본 스프레드시트 ↗</a>
      <span class="num" id="syncInfo" style="font-size:11px;color:#8D9BB0;padding:0 14px;line-height:1.6"></span>
    </div>
  </aside>
  <main id="main"><div class="card sec muted">불러오는 중입니다…</div></main>
</div>

<script>
(function () {
  var S = { page: 'site', tab: '전체', month: '', selId: '', typed: '', dd: false, act: 0,
            bonds: null, fund: null, sheets: null, err: {}, kind: '전체', query: '', calYM: '' };
  var TABS = ['전체', '회수 중', '회수 확인 대기', '완료현장'];
  var $ = function (id) { return document.getElementById(id); };
  var h = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return (n === null || n === undefined || n === '') ? '—' : (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); };
  var dot = function (iso) { return iso ? iso.replace(/-/g, '.') : ''; };
  var norm = function (v) { return String(v || '').normalize('NFKC').replace(/\s/g, '').replace(/[-~,]/g, '').toLowerCase(); };
  var key = function (v) {
    var s = String(v || '').split('\n')[0].normalize('NFKC').replace(/태양광발전소|발전소/g, '').replace(/\(주\)|주식회사|\(유\)/g, '');
    s = s.replace(/(\d)\s*[-,]\s*(\d)/g, '$1~$2').replace(/\s/g, '').toLowerCase();
    return s;
  };
  try { var saved = JSON.parse(localStorage.getItem('fs-view') || '{}'); if (saved.tab) S.tab = saved.tab; if (saved.selId) S.selId = saved.selId; } catch (e) {}
  function save() { try { localStorage.setItem('fs-view', JSON.stringify({ tab: S.tab, selId: S.selId })); } catch (e) {} }

  /* ---------- 데이터 ---------- */
  // 데이터 통로 (Apps Script '현장별 자금현황 웹앱' 배포 주소)
  var API = 'https://script.google.com/macros/s/AKfycbzuNUa1MUpLHfupz4Z6kIGnPP2JDKTf-1mOFMYKaf_xfZoWco_PuF9jhy_XGuRsBilDhg/exec';
  // ?embed=1 → 회사 ERP 안에서 '현장별 자금현황' 화면만 보기 전용으로 표시
  var EMBED = /[?&]embed=1\b/.test(location.search) && window.parent !== window;
  var ERP_ORIGIN = 'https://hseferp.vercel.app';
  var memKey = '';   // ERP가 넘겨준 키 (보기 모드에서는 저장하지 않고 메모리에만 둠)
  if (EMBED) { document.body.classList.add('embed'); S.page = 'site'; }
  function getKey() { if (EMBED) return memKey; try { return localStorage.getItem('fs-key') || ''; } catch (e) { return ''; } }
  function setKey(k) { if (EMBED) { memKey = k || ''; return; } try { if (k) localStorage.setItem('fs-key', k); else localStorage.removeItem('fs-key'); } catch (e) {} }
  var keyWait = null;
  function askErpKey() {
    try { window.parent.postMessage({ type: 'fs-need-key' }, ERP_ORIGIN); } catch (e) {}
    clearTimeout(keyWait);
    keyWait = setTimeout(function () { if (!memKey) showGate('ERP에서 접속 키를 받지 못했습니다. 직접 입력해 주세요.'); }, 5000);
  }
  window.addEventListener('message', function (e) {
    if (!EMBED || e.origin !== ERP_ORIGIN || e.source !== window.parent) return;
    var d = e.data || {};
    if (d.type === 'fs-key' && typeof d.key === 'string' && d.key) { clearTimeout(keyWait); var first = !memKey; memKey = d.key; S.err = {}; if (first) { render(); load(); } }
  });
  var PART = { getBonds: 'bonds', getFund: 'fund', getSheets: 'sheets', getSites: 'sites', getMatches: 'matches' };
  function call(fn, cb) {
    var part = PART[fn];
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: getKey(), parts: [part] }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) { if (r.code === 'key') { setKey(''); showGate(EMBED ? 'ERP에 등록된 접속 키가 맞지 않습니다. 직접 입력하거나 관리자에게 알려 주세요.' : '접속 키가 맞지 않습니다. 다시 입력해 주세요.'); return; } throw new Error(r.error || '알 수 없는 오류'); }
        if (r[part + 'Error']) throw new Error(r[part + 'Error']);
        if (r[part] === undefined) throw new Error('Apps Script를 새 버전으로 배포해야 합니다.');
        S.err[fn] = ''; cb(r[part]); render();
      })
      .catch(function (e) { S.err[fn] = (e && e.message) || String(e); render(); });
  }
  function load() {
    if (!getKey()) { if (EMBED && !keyWait) { askErpKey(); return; } showGate(''); return; }
    call('getBonds', function (r) { S.bonds = r; resetMatchCache(); });
    call('getFund', function (r) { S.fund = r; S.fundIdx = null; });
    call('getSheets', function (r) { S.sheets = r; resetMatchCache(); });
    call('getSites', function (r) { S.sites = r; resetMatchCache(); });
    call('getMatches', function (r) { S.matches = r; resetMatchCache(); });
  }
  function showGate(msg) {
    $('main').innerHTML = '<section class="card sec" style="max-width:460px"><b style="font-size:18px">접속 키 입력</b>' +
      '<span class="muted" style="font-size:13px">' + (EMBED ? 'ERP 화면 안에서는 키가 저장되지 않습니다.' : '처음 한 번만 입력하면 이 브라우저에 저장됩니다.') + '</span>' +
      (msg ? '<div class="err">' + h(msg) + '</div>' : '') +
      '<form id="gate" style="display:flex;gap:8px;flex-wrap:wrap"><label class="box" style="flex:1 1 220px;padding-right:12px"><span class="sr">접속 키</span><input id="gateKey" type="password" autocomplete="off" placeholder="접속 키"></label>' +
      '<button class="tab on" type="submit">확인</button></form></section>';
    var f = $('gate'); if (f) f.addEventListener('submit', function (e) { e.preventDefault(); var k = $('gateKey').value.trim(); if (!k) return; setKey(k); S.err = {}; render(); load(); });
  }
  function fundIndex() {
    if (S.fundIdx || !S.fund) return S.fundIdx || {};
    var idx = {};
    S.fund.sites.forEach(function (s) { var k = key(s.name); if (!idx[k]) idx[k] = s; });
    return (S.fundIdx = idx);
  }
  function findSite(c) {
    if (!c) return null;
    var idx = fundIndex(), k = key(c);
    var cands = [k, k.replace(/\(.*?\)/g, ''), k + '호', k.replace(/호$/, '')];
    for (var i = 0; i < cands.length; i++) if (cands[i] && idx[cands[i]]) return idx[cands[i]];
    return null;
  }
  function matchSite(it) {
    var s = findSite(it.sheetName) || findSite(it.name);
    if (!s && it.mergedMembers) for (var i = 0; i < it.mergedMembers.length && !s; i++) s = findSite(it.mergedMembers[i]);
    return s;
  }
  function items() { return (S.bonds && S.bonds.items) || []; }
  function inTab(t) { return items().filter(function (it) { return t === '전체' || it.status === t; }); }
  function dateTxt(it) { return it.inspectionDate ? dot(it.inspectionDate) + (it.inspectionPlanned ? ' (예정)' : '') : '미정'; }
  function dateCls(it) { return it.inspectionDate ? (it.inspectionPlanned ? 'c-plan' : 'c-done') : 'c-none'; }
  function mergeTxt(it) { return it.merged ? (it.mergedCount || (it.mergedMembers || []).length) + '개소 병합' : ''; }

  function filtered() {
    var tq = norm(S.typed);
    var list = inTab(S.tab).filter(function (it) {
      var d = it.inspectionDate || '';
      if (S.month === 'none' ? d : (S.month && d.slice(0, 7) !== S.month)) return false;
      if (!tq) return true;
      return norm(it.name).indexOf(tq) >= 0 || norm(it.sheetName).indexOf(tq) >= 0 || (it.mergedMembers || []).some(function (m) { return norm(m).indexOf(tq) >= 0; });
    });
    if (tq) list.sort(function (a, b) { return (norm(a.name).indexOf(tq) === 0 ? 0 : 1) - (norm(b.name).indexOf(tq) === 0 ? 0 : 1); });
    return list;
  }

  /* ---------- 렌더 ---------- */
  function render() {
    [].forEach.call(document.querySelectorAll('.navbtn[data-page]'), function (b) { b.classList.toggle('on', b.dataset.page === S.page); });
    var info = [];
    if (S.bonds) info.push('ERP ' + (S.bonds.generatedAt || '').replace('T', ' ').slice(0, 16));
    if (S.fund) info.push('시트 ' + S.fund.readAt);
    $('syncInfo').textContent = info.length ? '불러온 시각\n' + info.join(' · ') : '';
    var html = { site: pageSite, calendar: pageCalendar, notice: pageNotice, ledger: pageLedger }[S.page]();
    $('main').innerHTML = html;
    if (S.page === 'site') renderDropdown();
  }

  function errBox(fn, label) { return S.err[fn] ? '<div class="err">' + h(label) + ' 불러오기 실패: ' + h(S.err[fn]) + '</div>' : ''; }

  function pageSite() {
    var list = inTab(S.tab), sel = items().filter(function (it) { return it.id === S.selId; })[0];
    if (!sel && S.bonds && list.length) { sel = list[0]; S.selId = sel.id; }
    var site = sel && S.fund ? matchSite(sel) : null;

    var months = {}, noDate = 0;
    list.forEach(function (it) { if (it.inspectionDate) { var m = it.inspectionDate.slice(0, 7); months[m] = (months[m] || 0) + 1; } else noDate++; });
    var mOpts = '<option value="">전체 월</option>' + Object.keys(months).sort().reverse().map(function (m) {
      return '<option value="' + m + '"' + (S.month === m ? ' selected' : '') + '>' + m.slice(0, 4) + '년 ' + (+m.slice(5)) + '월 (' + months[m] + ')</option>';
    }).join('') + (noDate ? '<option value="none"' + (S.month === 'none' ? ' selected' : '') + '>검사일 없음 (' + noDate + ')</option>' : '');

    var tabs = TABS.map(function (t) { return '<button class="tab' + (S.tab === t ? ' on' : '') + '" data-tab="' + t + '">' + t + ' <span class="num">' + inTab(t).length + '</span></button>'; }).join('');

    var meta = [];
    if (site) { if (site.owner) meta.push('사업주 ' + site.owner); if (site.branch) meta.push(site.branch); if (site.units.length > 1) meta.push('호기 ' + site.units.join(', ')); }
