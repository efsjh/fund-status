<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장별 자금현황</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--line:#E3E8EF;--line2:#EEF2F6;--ink:#142033;--sub:#4A5668;--sub2:#3B4759;--nav:#0F1B2D;--teal:#0B6E78;--blue:#1D4ED8;--red:#9F1239;--amber:#B45309;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',Inter,sans-serif}
button,input,select{font-family:inherit}
a{color:var(--teal)}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch}
aside{flex:1 1 236px;max-width:100%;background:var(--nav);color:#E6ECF4;padding:24px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:10px;background:#12A3A8;display:flex;align-items:center;justify-content:center}
.navlbl{font-size:11px;font-weight:600;color:#8D9BB0;letter-spacing:.08em;padding:0 14px 6px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;background:transparent;color:#C9D3E0;text-decoration:none}
.navbtn.on{background:#1E3150;color:#FFF}
.navbtn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:2px solid #12A3A8;outline-offset:2px}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tab{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #C9D2DE;background:#FFF;color:#2A3648}
.tab.on{border-color:var(--nav);background:var(--nav);color:#FFF}
.th{font-size:12px;font-weight:600;color:var(--sub2);letter-spacing:.02em}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.c-done{background:#DDF3F4;color:#084F57}.c-plan{background:#FEF3C7;color:#92400E}.c-none{background:#EEF2F6;color:var(--sub2)}.c-merge{background:#EDE9FE;color:#5B21B6}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field>label{font-size:12px;font-weight:600;color:var(--sub2)}
.box{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF}
.box input{border:0;outline:none;font-size:15px;flex:1;min-width:0;color:var(--ink);background:transparent}
select.sel{min-height:44px;padding:0 10px;border:1px solid #C9D2DE;border-radius:10px;background:#FFF;font-size:14px;color:var(--ink)}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.dd{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:20;max-height:380px;overflow-y:auto;background:#FFF;border:1px solid #C9D2DE;border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.16);padding:6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:48px;padding:8px 10px;border:0;border-radius:8px;text-align:left;cursor:pointer;background:transparent}
.opt.sel,.opt:hover{background:#F2FAFA}.opt.act{background:#E6F5F6}
.opt b{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.opt small{font-size:12px;color:var(--sub)}
.grid-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.grid-sum>div{padding:18px 22px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.grid-sum>div:last-child{border-right:0}
.lbl{font-size:13px;font-weight:600;color:var(--sub2)}
.big{font-size:24px;font-weight:700}
.erp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.erp>div{padding:14px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line2)}
.erp>div:last-child{border-right:0}
.sec{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.scroll{overflow-x:auto}
.row{display:grid;gap:10px;align-items:center;min-height:42px;padding:0 8px;border-bottom:1px solid var(--line2);font-size:13px}
.head{display:grid;gap:10px;padding:10px 8px;background:#EEF2F6;border-radius:8px}
.r{text-align:right}
.muted{color:var(--sub);font-size:13px}
.err{padding:12px 14px;border-radius:10px;background:#FFF1F2;color:var(--red);font-size:13px}
.warn{padding:12px 14px;border-radius:10px;background:#FEF3C7;color:#78350F;font-size:13px}
.cal{min-width:560px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:92px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#FFF;border:1px solid var(--line)}
.cell.has{background:#F2FAFA;border-color:#B9E3E5}.cell.out{background:transparent;border-color:transparent}
.ev{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;background:#F3F5F8;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ERP 안에 끼워 볼 때(보기 전용): 왼쪽 메뉴 숨김 */
body.embed aside{display:none}
body.embed main{padding:20px 24px 32px}
@media (max-width:720px){main{padding:20px 16px 40px}.grid-sum{grid-template-columns:1fr}.grid-sum>div{border-right:0;border-bottom:1px solid var(--line)}.erp{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700;color:#FFF">효성에너지팜</span><span style="font-size:12px;color:#A9B6C8">현장별 자금현황</span></div>
    </div>
    <nav aria-label="메뉴" style="display:flex;flex-direction:column;gap:4px">
      <span class="navlbl">메인</span>
      <button class="navbtn" data-page="site">현장별 자금현황</button>
      <span class="navlbl" style="padding-top:18px">관리 시트</span>
      <button class="navbtn" data-page="transfer">전송검토</button>
      <button class="navbtn" data-page="calendar">채권관리 달력</button>
      <button class="navbtn" data-page="notice">미납공문 처리로그</button>
      <button class="navbtn" data-page="ledger">일자별 기록</button>
      <a class="navbtn" href="https://script.google.com/macros/s/AKfycbymTGjB-yBTcXqcMi09SRXBZ-WgRoJD1eq-wKOtNuB5Zyr7DAlEjRr7Clv4n5oeJubI/exec" target="_blank" rel="noopener">일자별 기록 보관 ↗</a>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <button class="navbtn" id="reloadBtn" style="border:1px solid #2B3A52">↻ 최신 내용 다시 불러오기</button>
      <a class="navbtn" href="https://hseferp.vercel.app/erp/app.html#bonds" target="_top" style="border:1px solid #2B3A52;color:#E6ECF4">← 회사 ERP</a>
      <a class="navbtn" href="https://docs.google.com/spreadsheets/d/1ERb-Mc878u3fY8Vv4ZvSSibzlMI7DpJG4nnv_qvvoiE/edit" target="_blank" rel="noopener" style="font-size:13px;color:#A9B6C8">원본 스프레드시트 ↗</a>
      <span class="num" id="syncInfo" style="font-size:11px;color:#8D9BB0;padding:0 14px;line-height:1.6"></span>
    </div>
  </aside>
  <main id="main"><div class="card sec muted">불러오는 중입니다…</div></main>
</div>

<script>
(function () {
  var S = { page: 'site', tab: '전체', month: '', selId: '', typed: '', dd: false, act: 0,
            bonds: null, fund: null, sheets: null, err: {}, filter: '전체', kind: '전체', query: '', calYM: '' };
  var TABS = ['전체', '회수 중', '회수 확인 대기', '완료현장'];
  var $ = function (id) { return document.getElementById(id); };
  var h = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return (n === null || n === undefined || n === '') ? '—' : (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); };
  var dot = function (iso) { return iso ? iso.replace(/-/g, '.') : ''; };
  var norm = function (v) { return String(v || '').normalize('NFKC').replace(/\s/g, '').replace(/[-~,]/g, '').toLowerCase(); };
  var key = function (v) {
    var s = String(v || '').split('\n')[0].normalize('NFKC').replace(/태양광발전소|발전소/g, '').replace(/\(주\)|주식회사|\(유\)/g, '');
    s = s.replace(/(\d)\s*[-,]\s*(\d)/g, '$1~$2').replace(/\s/g, '').toLowerCase();
    return s;
  };
  try { var saved = JSON.parse(localStorage.getItem('fs-view') || '{}'); if (saved.tab) S.tab = saved.tab; if (saved.selId) S.selId = saved.selId; } catch (e) {}
  function save() { try { localStorage.setItem('fs-view', JSON.stringify({ tab: S.tab, selId: S.selId })); } catch (e) {} }

  /* ---------- 데이터 ---------- */
  // 데이터 통로 (Apps Script '현장별 자금현황 웹앱' 배포 주소)
  var API = 'https://script.google.com/macros/s/AKfycbzuNUa1MUpLHfupz4Z6kIGnPP2JDKTf-1mOFMYKaf_xfZoWco_PuF9jhy_XGuRsBilDhg/exec';
  // ?embed=1 → 회사 ERP 안에서 '현장별 자금현황' 화면만 보기 전용으로 표시
  var EMBED = /[?&]embed=1\b/.test(location.search) && window.parent !== window;
  var ERP_ORIGIN = 'https://hseferp.vercel.app';
  var memKey = '';   // ERP가 넘겨준 키 (보기 모드에서는 저장하지 않고 메모리에만 둠)
  if (EMBED) { document.body.classList.add('embed'); S.page = 'site'; }
  function getKey() { if (EMBED) return memKey; try { return localStorage.getItem('fs-key') || ''; } catch (e) { return ''; } }
  function setKey(k) { if (EMBED) { memKey = k || ''; return; } try { if (k) localStorage.setItem('fs-key', k); else localStorage.removeItem('fs-key'); } catch (e) {} }
  var keyWait = null;
  function askErpKey() {
    try { window.parent.postMessage({ type: 'fs-need-key' }, ERP_ORIGIN); } catch (e) {}
    clearTimeout(keyWait);
    keyWait = setTimeout(function () { if (!memKey) showGate('ERP에서 접속 키를 받지 못했습니다. 직접 입력해 주세요.'); }, 5000);
  }
  window.addEventListener('message', function (e) {
    if (!EMBED || e.origin !== ERP_ORIGIN || e.source !== window.parent) return;
    var d = e.data || {};
    if (d.type === 'fs-key' && typeof d.key === 'string' && d.key) { clearTimeout(keyWait); var first = !memKey; memKey = d.key; S.err = {}; if (first) { render(); load(); } }
  });
  var PART = { getBonds: 'bonds', getFund: 'fund', getSheets: 'sheets' };
  function call(fn, cb) {
    var part = PART[fn];
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: getKey(), parts: [part] }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) { if (r.code === 'key') { setKey(''); showGate(EMBED ? 'ERP에 등록된 접속 키가 맞지 않습니다. 직접 입력하거나 관리자에게 알려 주세요.' : '접속 키가 맞지 않습니다. 다시 입력해 주세요.'); return; } throw new Error(r.error || '알 수 없는 오류'); }
        if (r[part + 'Error']) throw new Error(r[part + 'Error']);
        S.err[fn] = ''; cb(r[part]); render();
      })
      .catch(function (e) { S.err[fn] = (e && e.message) || String(e); render(); });
  }
  function load() {
    if (!getKey()) { if (EMBED && !keyWait) { askErpKey(); return; } showGate(''); return; }
    call('getBonds', function (r) { S.bonds = r; });
    call('getFund', function (r) { S.fund = r; S.fundIdx = null; });
    call('getSheets', function (r) { S.sheets = r; });
  }
  function showGate(msg) {
    $('main').innerHTML = '<section class="card sec" style="max-width:460px"><b style="font-size:18px">접속 키 입력</b>' +
      '<span class="muted" style="font-size:13px">' + (EMBED ? 'ERP 화면 안에서는 키가 저장되지 않습니다.' : '처음 한 번만 입력하면 이 브라우저에 저장됩니다.') + '</span>' +
      (msg ? '<div class="err">' + h(msg) + '</div>' : '') +
      '<form id="gate" style="display:flex;gap:8px;flex-wrap:wrap"><label class="box" style="flex:1 1 220px;padding-right:12px"><span class="sr">접속 키</span><input id="gateKey" type="password" autocomplete="off" placeholder="접속 키"></label>' +
      '<button class="tab on" type="submit">확인</button></form></section>';
    var f = $('gate'); if (f) f.addEventListener('submit', function (e) { e.preventDefault(); var k = $('gateKey').value.trim(); if (!k) return; setKey(k); S.err = {}; render(); load(); });
  }
  function fundIndex() {
    if (S.fundIdx || !S.fund) return S.fundIdx || {};
    var idx = {};
    S.fund.sites.forEach(function (s) { var k = key(s.name); if (!idx[k]) idx[k] = s; });
    return (S.fundIdx = idx);
  }
  function findSite(c) {
    if (!c) return null;
    var idx = fundIndex(), k = key(c);
    var cands = [k, k.replace(/\(.*?\)/g, ''), k + '호', k.replace(/호$/, '')];
    for (var i = 0; i < cands.length; i++) if (cands[i] && idx[cands[i]]) return idx[cands[i]];
    return null;
  }
  function matchSite(it) {
    var s = findSite(it.sheetName) || findSite(it.name);
    if (!s && it.mergedMembers) for (var i = 0; i < it.mergedMembers.length && !s; i++) s = findSite(it.mergedMembers[i]);
    return s;
  }
  function items() { return (S.bonds && S.bonds.items) || []; }
  function inTab(t) { return items().filter(function (it) { return t === '전체' || it.status === t; }); }
  function dateTxt(it) { return it.inspectionDate ? dot(it.inspectionDate) + (it.inspectionPlanned ? ' (예정)' : '') : '미정'; }
  function dateCls(it) { return it.inspectionDate ? (it.inspectionPlanned ? 'c-plan' : 'c-done') : 'c-none'; }
  function mergeTxt(it) { return it.merged ? (it.mergedCount || (it.mergedMembers || []).length) + '개소 병합' : ''; }

  function filtered() {
    var tq = norm(S.typed);
    var list = inTab(S.tab).filter(function (it) {
      var d = it.inspectionDate || '';
      if (S.month === 'none' ? d : (S.month && d.slice(0, 7) !== S.month)) return false;
      if (!tq) return true;
      return norm(it.name).indexOf(tq) >= 0 || norm(it.sheetName).indexOf(tq) >= 0 || (it.mergedMembers || []).some(function (m) { return norm(m).indexOf(tq) >= 0; });
    });
    if (tq) list.sort(function (a, b) { return (norm(a.name).indexOf(tq) === 0 ? 0 : 1) - (norm(b.name).indexOf(tq) === 0 ? 0 : 1); });
    return list;
  }

  /* ---------- 렌더 ---------- */
  function render() {
    [].forEach.call(document.querySelectorAll('.navbtn[data-page]'), function (b) { b.classList.toggle('on', b.dataset.page === S.page); });
    var info = [];
    if (S.bonds) info.push('ERP ' + (S.bonds.generatedAt || '').replace('T', ' ').slice(0, 16));
    if (S.fund) info.push('시트 ' + S.fund.readAt);
    $('syncInfo').textContent = info.length ? '불러온 시각\n' + info.join(' · ') : '';
    var html = { site: pageSite, transfer: pageTransfer, calendar: pageCalendar, notice: pageNotice, ledger: pageLedger }[S.page]();
    $('main').innerHTML = html;
    if (S.page === 'site') renderDropdown();
  }

  function errBox(fn, label) { return S.err[fn] ? '<div class="err">' + h(label) + ' 불러오기 실패: ' + h(S.err[fn]) + '</div>' : ''; }

  function pageSite() {
    var list = inTab(S.tab), sel = items().filter(function (it) { return it.id === S.selId; })[0];
    if (!sel && S.bonds && list.length) { sel = list[0]; S.selId = sel.id; }
    var site = sel && S.fund ? matchSite(sel) : null;

    var months = {}, noDate = 0;
    list.forEach(function (it) { if (it.inspectionDate) { var m = it.inspectionDate.slice(0, 7); months[m] = (months[m] || 0) + 1; } else noDate++; });
    var mOpts = '<option value="">전체 월</option>' + Object.keys(months).sort().reverse().map(function (m) {
      return '<option value="' + m + '"' + (S.month === m ? ' selected' : '') + '>' + m.slice(0, 4) + '년 ' + (+m.slice(5)) + '월 (' + months[m] + ')</option>';
    }).join('') + (noDate ? '<option value="none"' + (S.month === 'none' ? ' selected' : '') + '>검사일 없음 (' + noDate + ')</option>' : '');

    var tabs = TABS.map(function (t) { return '<button class="tab' + (S.tab === t ? ' on' : '') + '" data-tab="' + t + '">' + t + ' <span class="num">' + inTab(t).length + '</span></button>'; }).join('');

    var meta = [];
    if (site) { if (site.owner) meta.push('사업주 ' + site.owner); if (site.branch) meta.push(site.branch); if (site.units.length > 1) meta.push('호기 ' + site.units.join(', ')); }
    if (sel && sel.merged && sel.mergedMembers.length) meta.push('병합: ' + sel.mergedMembers.join(', '));
    if (sel && site && norm(site.name) !== norm(sel.name)) meta.unshift('시트: ' + site.name);

    var out = '<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">' +
      '<div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +
        '<span class="muted">현장별 자금현황</span>' +
        '<h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em">' + h(sel ? sel.name : '현장별 자금현황') + '</h1>' +
        (sel ? '<span style="display:flex;flex-wrap:wrap;gap:8px"><span class="chip num ' + dateCls(sel) + '">사용전검사 ' + h(dateTxt(sel)) + '</span>' +
          (sel.merged ? '<span class="chip c-merge">' + h(mergeTxt(sel)) + '</span>' : '') +
          (sel.status ? '<span class="chip c-none">' + h(sel.status) + '</span>' : '') + '</span>' : '') +
        '<span class="muted">' + h(meta.join('  ·  ')) + '</span>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;flex:0 1 480px;min-width:260px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px" role="group" aria-label="ERP 채권관리 구분">' + tabs + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">' +
          '<label class="field" style="flex:0 0 150px"><span>사용전검사 월</span><select class="sel" id="monthSel">' + mOpts + '</select></label>' +
          '<div class="field" style="flex:1 1 260px;min-width:0;position:relative">' +
            '<label for="siteInput">발전소 선택 <span class="num" id="optCount" style="font-weight:400;color:var(--sub)"></span></label>' +
            '<span class="box"><input id="siteInput" role="combobox" aria-expanded="false" aria-controls="ddList" autocomplete="off" placeholder="발전소명 입력 (예: 보성)" value="' + h(sel ? sel.name : '') + '">' +

    out += errBox('getBonds', 'ERP 채권관리') + errBox('getFund', '자금현황 시트');
    if (!S.bonds || !S.fund) return out + (S.err.getBonds || S.err.getFund ? '' : '<div class="card sec muted">ERP와 시트에서 최신 내용을 불러오는 중입니다…</div>');

    var sum = function (xs) { return xs.reduce(function (a, x) { return a + x.a; }, 0); };
    var invSum = sum(site.inv), incSum = sum(site.inc), expSum = sum(site.exp), unpaid = invSum - incSum;
    out += '<div class="card grid-sum">' +
      '<div><span class="lbl">계산서 발행금액</span><span class="num big">' + fmt(invSum) + '</span></div>' +

    var g1 = 'grid-template-columns:96px 112px 96px 112px 90px minmax(0,1fr)';
    var n = Math.max(site.inv.length, site.inc.length), rows = '';
    for (var i = 0; i < n; i++) {
      var v = site.inv[i], c = site.inc[i];
      rows += '<div class="row" style="' + g1 + '"><span class="num">' + (v ? v.d : '') + '</span><span class="num r" style="font-weight:600">' + (v ? fmt(v.a) : '') + '</span><span class="num">' + (c ? c.d : '') + '</span><span class="num r" style="font-weight:600;color:var(--blue)">' + (c ? fmt(c.a) : '') + '</span><span>' + h(c ? c.v : '') + '</span><span style="color:var(--sub2)">' + h(c ? c.m : '') + '</span></div>';
    }
    var inSec = '<section class="card sec"><div style="display:flex;justify-content:space-between;gap:12px"><h2>입금 및 매출 내역</h2><span class="num muted" style="font-size:12px">계산서 ' + site.inv.length + '건 · 수금 ' + site.inc.length + '건</span></div><div class="scroll"><div style="min-width:640px">' +
      '<div class="head" style="' + g1 + '"><span class="th">계산서발행일</span><span class="th r">금액(vat포함)</span><span class="th">수금일</span><span class="th r">수금액</span><span class="th">거래처</span><span class="th">비고</span></div>' +
      (rows || '<div class="muted" style="padding:20px 8px">등록된 계산서·수금 내역이 없습니다.</div>') +
      '<div class="row" style="' + g1 + ';border:0;font-weight:700"><span>합계</span><span class="num r">' + fmt(invSum) + '</span><span></span><span class="num r" style="color:var(--blue)">' + fmt(incSum) + '</span><span></span><span></span></div></div></div></section>';

    var costs = site.sub + site.module + site.line + site.sales + site.etc, profit = invSum - costs;

    var g2 = 'grid-template-columns:minmax(0,1fr) 160px 90px;font-size:14px';
    var line = function (l, a, p, kind) {
      return '<div class="row" style="' + g2 + (kind === 'profit' ? ';background:#E6F5F6;border-radius:8px;border:0;margin-top:6px' : '') + '"><span style="font-weight:' + (kind ? 700 : 400) + (kind === 'profit' ? ';color:#084F57' : '') + '">' + l + '</span><span class="num r" style="font-weight:' + (kind ? 700 : 500) + (kind === 'profit' ? ';color:' + (profit < 0 ? 'var(--amber)' : '#084F57') : '') + '">' + a + '</span><span class="num r" style="font-size:13px;color:var(--sub2)">' + p + '</span></div>';

      line('하도급', fmt(site.sub), pct(site.sub)) + line('모듈, 인버터', fmt(site.module), pct(site.module)) + line('한전선로비', fmt(site.line), pct(site.line)) +

    var g3 = 'grid-template-columns:96px 112px 120px minmax(0,1fr)';
    var exp = '<section class="card sec" style="flex:1 1 440px;min-width:0"><div style="display:flex;justify-content:space-between;gap:12px"><h2>기자재 및 지출 내역</h2><span class="num muted" style="font-size:12px">' + site.exp.length + '건</span></div><div class="scroll"><div style="min-width:480px">' +
      '<div class="head" style="' + g3 + '"><span class="th">지급일</span><span class="th r">지급액</span><span class="th">거래처</span><span class="th">비고</span></div>' +

      '<div class="row" style="' + g3 + ';border:0;font-weight:700"><span>합계</span><span class="num r" style="color:var(--amber)">' + fmt(expSum) + '</span><span></span><span></span></div></div></div></section>';

    return out + '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start"><div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">' + inSec + pnl + '</div>' + exp + '</div>';
  }

  function renderDropdown() {

  }

  function pick(id) { S.selId = id; S.typed = ''; S.dd = false; save(); render(); }

  /* ---------- 관리 페이지 ---------- */

  function waitSheets() { return errBox('getSheets', '관리 시트') + (S.sheets ? '' : (S.err.getSheets ? '' : '<div class="card sec muted">시트에서 불러오는 중입니다…</div>')); }

  function pageTransfer() {
    var out = headerSub('전송검토') + waitSheets();

    }).join('') + '</div><div class="scroll"><div style="min-width:860px"><div class="head" style="' + g + '"><span class="th">상태</span><span class="th">발전소</span><span class="th">사용전검사</span><span class="th r">목표 (현장관리 합)</span><span class="th r">기전송 합계</span><span class="th r">차액</span></div>' +

      }).join('') + '</div></div></section>';
  }

  function pageCalendar() {
    var out = headerSub('채권관리 달력') + errBox('getBonds', 'ERP 채권관리');
    if (!S.bonds) return out + (S.err.getBonds ? '' : '<div class="card sec muted">ERP에서 불러오는 중입니다…</div>');
    var now = new Date(), ym = S.calYM || (now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2));
    var y = +ym.slice(0, 4), m = +ym.slice(5), first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    var ev = {};
    items().forEach(function (it) { if (it.inspectionDate && it.inspectionDate.slice(0, 7) === ym) { var d = +it.inspectionDate.slice(8); (ev[d] = ev[d] || []).push(it); } });
    var cells = '';
    for (var i = 0; i < Math.ceil((first + days) / 7) * 7; i++) {
      var d = i - first + 1, ok = d >= 1 && d <= days, dow = i % 7, e = ok ? (ev[d] || []) : [];
      cells += '<div class="cell' + (!ok ? ' out' : e.length ? ' has' : '') + '">' + (ok ? '<span class="num" style="font-size:13px;font-weight:600;color:' + (dow === 0 ? 'var(--red)' : dow === 6 ? 'var(--blue)' : '#2A3648') + '">' + d + '</span>' : '') +
        e.map(function (it) { return '<button class="ev" data-id="' + h(it.id) + '" title="' + h(it.name) + '" style="border:0;cursor:pointer;text-align:left;' + (it.inspectionPlanned ? 'background:#FEF3C7;color:#92400E' : 'background:#DDF3F4;color:#084F57') + '">' + h(it.name) + '</button>'; }).join('') + '</div>';
    }
    var monthList = items().filter(function (it) { return it.inspectionDate && it.inspectionDate.slice(0, 7) === ym; });
    var unpaid = items().filter(function (it) { return it.balance > 0 && it.inspectionDate && !it.inspectionPlanned && it.status !== '완료현장'; }).sort(function (a, b) { return b.balance - a.balance; });
    var box = function (title, list, badge, sub) {
      return '<div class="card sec"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">' + title + '</b><span class="chip num" style="' + badge + '">' + list.length + '</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        (list.slice(0, 40).map(function (it) { return '<button class="pill" data-id="' + h(it.id) + '" style="cursor:pointer">' + h(it.name) + (sub ? ' <span class="num" style="color:var(--red)">' + sub(it) + '</span>' : '') + '</button>'; }).join('') || '<span class="muted">없음</span>') + '</div></div>';
    };
    return out + '<div style="display:flex;flex-wrap:wrap;gap:16px"><section class="card sec" style="flex:3 1 560px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +

      '<div class="scroll"><div class="cal">' + ['일', '월', '화', '수', '목', '금', '토'].map(function (w, i) { return '<span class="th" style="text-align:center;' + (i === 0 ? 'color:var(--red)' : i === 6 ? 'color:var(--blue)' : '') + '">' + w + '</span>'; }).join('') + cells + '</div></div>' +
      '<span class="muted" style="font-size:12px">초록: 검사 완료 · 노랑: 예정 · 발전소를 누르면 자금현황으로 이동</span></section>' +
      '<section style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px">' +

      box('잔금 남은 현장 (검사 완료)', unpaid, 'background:#FFE4E6;color:#9F1239', function (it) { return fmt(it.balance); }) + '</section></div>';
  }

  function pageLedger() {

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.page) { if (EMBED) return; S.page = t.dataset.page; S.dd = false; render(); }
    else if (t.dataset.tab) { S.tab = t.dataset.tab; S.month = ''; S.typed = ''; S.dd = false; var f = inTab(S.tab)[0]; S.selId = f ? f.id : ''; save(); render(); }
    else if (t.dataset.filter) { S.filter = t.dataset.filter; render(); }
    else if (t.dataset.kind) { S.kind = t.dataset.kind; render(); }
    else if (t.dataset.cal) { var now = new Date(), ym = S.calYM || (now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2)); var d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + (+t.dataset.cal), 1); S.calYM = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); render(); }

    return get.then(function (tpl) {
      var vals = docVals(f, kind), esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
      var doc = tpl.doc.replace(/\{\{([^}]+)\}\}/g, function (m, k) { return esc(vals[k]); }).replace(/<w:highlight w:val="yellow"\/>/g, '');
      var enc = new TextEncoder(), b64 = function (b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
      return zipStore(tpl.order.map(function (name) { return { name: name, data: name === 'word/document.xml' ? enc.encode(doc) : b64(tpl.parts[name]) }; }));
    });
  }
  function fileName(f, kind) { return (kind === '미납공문' ? '잔금미납안내공문_' : '내용증명_') + String(f.site || '발전소').replace(/[\\\/:*?"<>|]/g, '_') + '_' + String(f.date || '').replace(/-/g, '') + '.docx'; }
  function saveBlob(name, blob) { var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 8000); }
  var DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  function nfPick(name) {
    var o = nfSources().filter(function (x) { return x.name === name; })[0];
    S.nf = Object.assign(emptyForm(), o ? o.fill : { site: name });
    S.nfQ = ''; S.nfOpen = false; S.nfMsg = o ? '' : name + ' — 불러온 정보가 없어 직접 입력해 주세요';
    if (S.page !== 'notice') S.page = 'notice';
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function nfMake() {
    var kind = S.nfKind, f = Object.assign({}, S.nf);
    if (!f.site || !numOf(f.due)) { S.nfMsg = '발전소와 금액을 입력해 주세요'; render(); return; }
    if (kind === '미납공문' && !f.docNo) f.docNo = nextDocNo(f.date);
    S.nfMsg = '파일 만드는 중…'; render();
    makeDocx(f, kind).then(function (bytes) {
      var fn = fileName(f, kind);
      saveBlob(fn, new Blob([bytes], { type: DOCX_MIME }));
      var L = lgGet(); L.unshift({ id: 'n' + Date.now().toString(36), kind: kind, docNo: kind === '미납공문' ? f.docNo : '', site: f.site, owner: f.owner || '', amount: numOf(f.due), date: f.date, status: '작성', reg: '', form: f, createdAt: new Date().toISOString() }); lgSet(L);
      S.nfMsg = fn + ' 저장 · 발송대장에 기록했습니다'; render();
    }).catch(function (e) { S.nfMsg = '파일을 만들지 못했습니다: ' + ((e && e.message) || e); render(); });
  }
  function lgUpdate(id, patch) { var L = lgGet(); L.forEach(function (r) { if (r.id === id) Object.assign(r, patch); }); lgSet(L); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-nfkind],[data-nfpick],#nfMake,#nfReset,#lgCsv,[data-lgagain],[data-lgdel]');
    if (!t) return;
    if (t.dataset.nfkind) { S.nfKind = t.dataset.nfkind; S.nfMsg = ''; render(); }
    else if (t.dataset.nfpick) nfPick(t.dataset.nfpick);
    else if (t.id === 'nfMake') nfMake();
    else if (t.id === 'nfReset') { S.nf = emptyForm(); S.nfQ = ''; S.nfMsg = ''; render(); }
    else if (t.id === 'lgCsv') {
      var rows = [['시행일자', '종류', '문서번호', '발전소', '사업주', '금액', '상태', '등기번호']].concat(lgGet().map(function (r) { return [r.date, r.kind, r.docNo || '', r.site, r.owner || '', r.amount, r.status, r.reg || '']; }));
      var csv = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
      saveBlob('공문발송대장_' + isoToday().replace(/-/g, '') + '.csv', new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    }
    else if (t.dataset.lgagain) { var r = lgGet().filter(function (x) { return x.id === t.dataset.lgagain; })[0]; if (r && r.form) makeDocx(r.form, r.kind).then(function (b) { saveBlob(fileName(r.form, r.kind), new Blob([b], { type: DOCX_MIME })); }); }
    else if (t.dataset.lgdel) { if (S.nfDel === t.dataset.lgdel) { lgSet(lgGet().filter(function (x) { return x.id !== t.dataset.lgdel; })); S.nfDel = ''; } else S.nfDel = t.dataset.lgdel; render(); }
  });
  document.addEventListener('mousedown', function (e) { if (e.target.closest('[data-nfpick]') && e.target.closest('#nfList')) e.preventDefault(); });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'nfSite') { S.nfQ = t.value; S.nfOpen = true; var l = $('nfList'); if (l) { l.style.display = 'block'; l.innerHTML = nfList(); } }
    else if (t.classList && t.classList.contains('nf-in')) {
      var k = t.dataset.f; S.nf[k] = t.value;
      if (k === 'idate') { S.nf.ddate = monthEnd(t.value); var dd = document.querySelector('.nf-in[data-f="ddate"]'); if (dd) dd.value = S.nf.ddate; }
      if ((k === 'total' || k === 'paid') && S.nfKind === '내용증명') { var d = numOf(S.nf.total) - numOf(S.nf.paid); S.nf.due = d > 0 ? won(d) : ''; var di = document.querySelector('.nf-in[data-f="due"]'); if (di) di.value = S.nf.due; var dh = $('nfh-due'); if (dh) dh.textContent = nfHint('due'); }
      var hEl = $('nfh-' + k); if (hEl) hEl.textContent = nfHint(k);
      nfRefresh();
    }
    else if (t.dataset && t.dataset.lgreg) lgUpdate(t.dataset.lgreg, { reg: t.value });
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('nf-in') && /^(total|paid|due)$/.test(t.dataset.f)) { var v = numOf(t.value); t.value = S.nf[t.dataset.f] = v ? won(v) : ''; }
    else if (t.dataset && t.dataset.lgst) lgUpdate(t.dataset.lgst, { status: t.value });
  });
  document.addEventListener('focusin', function (e) { if (e.target.id === 'nfSite') { try { e.target.select(); } catch (x) {} S.nfOpen = true; S.nfQ = ''; var l = $('nfList'); if (l) { l.style.display = 'block'; l.innerHTML = nfList(); } } });
  document.addEventListener('focusout', function (e) { if (e.target.id === 'nfSite') setTimeout(function () { S.nfOpen = false; S.nfQ = ''; var l = $('nfList'); if (l) l.style.display = 'none'; var i = $('nfSite'); if (i && document.activeElement !== i) i.value = S.nf.site || ''; }, 150); });

  render();
  load();
  setInterval(function () { if (!document.hidden && !S.dd) load(); }, 5 * 60 * 1000);
  // 다른 탭(일자별 기록 보관 등)에서 저장하고 돌아오면 자동으로 다시 불러오기
  var lastLoad = Date.now();
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !S.dd && Date.now() - lastLoad > 15000) { lastLoad = Date.now(); load(); } });
})();
</script>
</body>
</html>
